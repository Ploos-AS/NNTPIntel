name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e . pytest ruff
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nntpintel
          POSTGRES_USER: nntpintel
          POSTGRES_PASSWORD: nntpintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nntpintel -d nntpintel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NNTPINTEL_DATABASE_URL: postgresql://nntpintel:nntpintel@127.0.0.1:5432/nntpintel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PostgreSQL 17 client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Install PostgreSQL support
        run: python -m pip install -e '.[postgres]'
      - name: Qualify PostgreSQL migrations and partitioned schema
        run: python tools/qualify_postgres.py
      - name: Qualify PostgreSQL backup and restore
        run: python tools/qualify_backup_restore.py
      - name: Qualify partition lifecycle and maintenance status
        run: python tools/qualify_maintenance.py
      - name: Qualify exact and bulk partition retirement
        run: python tools/qualify_partition_retention.py
      - name: Qualify maintenance CLI safety
        run: python tools/qualify_maintenance_cli.py
      - name: Qualify group and hierarchy rollups
        run: python tools/qualify_group_rollups.py
      - name: Qualify propagation rollups
        run: python tools/qualify_propagation_rollups.py
      - name: Qualify topology evidence and incident rollups
        run: python tools/qualify_topology_rollups.py
