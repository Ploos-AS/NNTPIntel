[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nntpintel"
version = "0.1.0.dev0"
description = "NNTP/Usenet observability and intelligence tooling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ploos AS" }]
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
nntpintel-probe = "nntpintel.cli:main"
nntpintel = "nntpintel.admin:main"
nntpintel-maintenance = "nntpintel.maintenance_cli:main"
nntpintel-backup = "nntpintel.backup_cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/nntpintel"]
